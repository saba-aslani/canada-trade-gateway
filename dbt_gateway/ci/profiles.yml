# Profile used by GitHub Actions only. Values come from repository secrets,
# so no credentials live in the repo. Local development keeps using the
# profile in ~/.dbt/profiles.yml.
trade_gateway:
  target: ci
  outputs:
    ci:
      type: postgres
      host: "{{ env_var('NEON_HOST') }}"
      user: "{{ env_var('NEON_USER') }}"
      password: "{{ env_var('NEON_PASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('NEON_DBNAME', 'neondb') }}"
      schema: analytics
      sslmode: require
      threads: 4
