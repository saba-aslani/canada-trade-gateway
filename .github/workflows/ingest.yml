name: ingest

on:
  workflow_dispatch: {}   # driven by an external scheduler every 15 minutes

# A late run must never overlap a running one and write the same snapshot twice.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ingestion dependencies
        run: pip install -r requirements.txt

      - name: Fetch CBSA border wait times
        working-directory: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python cbsa_fetch.py

      # The two feeds are independent sources. A CBSA outage should not cost us
      # the vessel snapshot for that window, and neither outage should stop the
      # warehouse from rebuilding on whatever did land. `if: always()` keeps the
      # later steps running while still letting the job report failure, so a
      # broken feed stays visible instead of being quietly swallowed.
      - name: AIS snapshot (Vancouver + Prince Rupert)
        if: always()
        working-directory: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AIS_LISTEN_SECONDS: "240"
        run: python ais_snapshot.py

      - name: Install dbt
        if: always()
        run: pip install dbt-core==1.12.0 dbt-postgres==1.11.0

      - name: Build and test the warehouse
        if: always()
        working-directory: dbt_gateway
        env:
          DBT_PROFILES_DIR: ci
          NEON_HOST: ${{ secrets.NEON_HOST }}
          NEON_USER: ${{ secrets.NEON_USER }}
          NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
        run: |
          dbt deps
          dbt build
