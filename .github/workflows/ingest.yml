name: ingest

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay/skip under load)
  workflow_dispatch: {}       # manual trigger for testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch CBSA border wait times
        working-directory: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python cbsa_fetch.py

      - name: AIS snapshot (Vancouver + Prince Rupert)
        working-directory: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AIS_LISTEN_SECONDS: "240"
        run: python ais_snapshot.py
